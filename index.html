<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Palavras — Grupo de Louvor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #14181f;
    --panel: #1c2330;
    --panel-alt: #262f40;
    --paper: #f3efe6;
    --paper-dim: #b9b6ae;
    --gold: #d9a441;
    --gold-dim: #8a713a;
    --sage: #7fa98b;
    --line: #333d4f;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 16px 80px;
  }

  header.top {
    padding: 4px 2px 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 8px;
  }

  h1 {
    font-family: 'Petrona', serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--paper);
  }

  .sub {
    font-size: 14px;
    color: var(--paper-dim);
    margin: 0 0 18px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--panel);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--sage));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--paper-dim);
    white-space: nowrap;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .btn-ghost {
    font-family: 'Manrope', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--paper-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .btn-ghost:hover { color: var(--paper); border-color: var(--gold-dim); }
  .btn-ghost:focus-visible, button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .weeks { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--panel);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    overflow: hidden;
    transition: border-color 0.2s ease;
  }
  .card.is-current { border-left-color: var(--gold); }
  .card.is-done { border-left-color: var(--sage); }

  .card-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
  }

  .num {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--gold-dim);
    width: 26px;
    flex-shrink: 0;
  }
  .is-current .num, .is-done .num { color: var(--gold); }

  .head-text { flex: 1; min-width: 0; }

  .date-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
  }

  .date {
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    color: var(--paper-dim);
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 7px;
    border-radius: 99px;
    background: var(--gold);
    color: #1a1408;
    font-weight: 700;
  }
  .tag.done { background: var(--sage); color: #0e1a13; }

  .title {
    font-family: 'Petrona', serif;
    font-size: 16.5px;
    font-weight: 600;
    color: var(--paper);
    line-height: 1.3;
  }

  .chev {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: var(--paper-dim);
    transition: transform 0.25s ease;
  }
  .card.open .chev { transform: rotate(180deg); color: var(--gold); }

  .card-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.3s ease;
  }
  .card.open .card-body { grid-template-rows: 1fr; }
  .card-body-inner { overflow: hidden; }

  .content { padding: 2px 16px 18px; }

  .block { margin-bottom: 14px; }

  .label {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 5px;
  }

  .idea {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--paper);
  }

  .keywords { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 99px;
    background: var(--panel-alt);
    color: var(--paper-dim);
    border: 1px solid var(--line);
  }

  .esboco-item {
    font-size: 14px;
    line-height: 1.55;
    margin-bottom: 8px;
    padding-left: 2px;
    color: var(--paper);
  }
  .esboco-item b { color: var(--gold); font-weight: 700; }

  .bonus {
    font-size: 13px;
    line-height: 1.55;
    color: var(--paper-dim);
    background: var(--panel-alt);
    border-radius: 10px;
    padding: 10px 12px;
    border: 1px dashed var(--line);
  }

  .pergunta-box {
    background: var(--panel-alt);
    border-radius: 10px;
    padding: 12px 13px;
  }
  .pergunta-txt {
    font-size: 14.5px;
    font-style: italic;
    color: var(--paper);
    margin: 0 0 4px;
  }
  .pergunta-note {
    font-size: 11px;
    color: var(--paper-dim);
    margin: 0 0 10px;
  }
  .branch { font-size: 13.5px; line-height: 1.5; margin-top: 8px; color: var(--paper); }
  .branch b { color: var(--sage); }

  .verse-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold-dim);
    border-radius: 99px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .verse-toggle:hover { background: rgba(217,164,65,0.1); }

  .verse-panel {
    margin-top: 10px;
    padding: 12px 13px;
    background: var(--panel-alt);
    border-left: 2px solid var(--gold);
    border-radius: 6px;
    display: none;
  }
  .verse-panel.show { display: block; }
  .verse-ref {
    font-family: 'Petrona', serif;
    font-style: italic;
    font-size: 14.5px;
    color: var(--paper);
    margin: 0 0 6px;
  }
  .verse-note {
    font-size: 12px;
    color: var(--paper-dim);
    line-height: 1.5;
    margin: 0;
  }
  .verse-disclaimer {
    font-size: 10.5px;
    color: var(--paper-dim);
    margin-top: 6px;
    opacity: 0.75;
  }
  textarea.verse-text {
    margin-top: 10px;
    min-height: 44px;
    font-style: italic;
  }
  .verse-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 2px;
  }
  .verse-link {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid var(--gold-dim);
    padding-bottom: 1px;
  }
  .verse-link:hover { border-bottom-color: var(--gold); }

  .registro-wrap { margin-top: 4px; }
  textarea.registro {
    width: 100%;
    min-height: 60px;
    resize: vertical;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--paper);
    font-family: 'Manrope', sans-serif;
    font-size: 13.5px;
    padding: 9px 10px;
    line-height: 1.5;
  }
  textarea.registro::placeholder { color: var(--paper-dim); opacity: 0.6; }

  .done-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .done-row label {
    font-size: 13px;
    color: var(--paper-dim);
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
  }
  .done-row input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: var(--sage);
    cursor: pointer;
  }
  .save-hint {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--sage);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .save-hint.show { opacity: 1; }

  footer.foot {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .foot button {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--paper-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <p class="eyebrow">Grupo de Louvor · 20h</p>
    <h1>Painel de Palavras</h1>
    <p class="sub">Agosto a Dezembro de 2026 · 19 encontros de segunda-feira</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0/19</span>
    </div>
    <div class="toolbar">
      <button class="btn-ghost" id="expandAllBtn" type="button">Abrir tudo</button>
      <button class="btn-ghost" id="collapseAllBtn" type="button">Fechar tudo</button>
    </div>
  </header>

  <div class="weeks" id="weeksContainer"></div>

  <footer class="foot">
    <button id="resetBtn" type="button">Limpar meus registros e marcações</button>
  </footer>

</div>

<script>
const WEEKS = [
  { n:1, iso:"2026-08-24", date:"24/08", title:"Somos exemplo, não pedra de tropeço",

    refs:[{l:"1 Coríntios 8",u:"https://www.bibliaonline.com.br/acf/1co/8"},{l:"1 Timóteo 4",u:"https://www.bibliaonline.com.br/acf/1tm/4"}],

  { n:2, iso:"2026-08-31", date:"31/08", title:"Deus nos usa como porta-voz",

    refs:[{l:"Êxodo 4",u:"https://www.bibliaonline.com.br/acf/ex/4"},{l:"Jeremias 1",u:"https://www.bibliaonline.com.br/acf/jr/1"}],

  { n:3, iso:"2026-09-07", date:"07/09", title:"Sejam fortes e corajosos",

  { n:4, iso:"2026-09-14", date:"14/09", title:"A língua: o órgão mais perigoso do corpo",

  { n:6, iso:"2026-09-28", date:"28/09", title:"Coração antes do talento",

  { n:7, iso:"2026-10-05", date:"05/10", title:"Servos, não estrelas",

const STORAGE_KEY = "louvor2026-state";
let state = {};
let stateLoaded = false;

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function todayISO(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function classify(iso){
  const target = new Date(iso + "T00:00:00");
  target.setHours(0,0,0,0);
  const today = todayISO();
  if (target.getTime() === today.getTime()) return "today";
  if (target.getTime() > today.getTime()) return "future";
  return "past";
}

function findCurrentWeek(){
  // week that is today, or the closest future one; if none future, the last past one
  const today = todayISO();
  let best = null;
  for (const w of WEEKS){
    const target = new Date(w.iso + "T00:00:00");
    target.setHours(0,0,0,0);
    if (target.getTime() >= today.getTime()){
      if (!best || target.getTime() < new Date(best.iso+"T00:00:00").getTime()) best = w;
    }
  }
  if (!best) best = WEEKS[WEEKS.length - 1];
  return best.n;
}

function renderEsboco(items){
  return items.map(it => `<div class="esboco-item"><b>${escapeHtml(it.l)}:</b> ${escapeHtml(it.t)}</div>`).join('');
}

function renderBranches(branches){
  return branches.map(b => `<div class="branch"><b>${escapeHtml(b.l)}:</b> ${escapeHtml(b.t)}</div>`).join('');
}

function cardTemplate(w, currentN){
  const st = state[w.n] || { done:false, registro:"" };
  const isCurrent = w.n === currentN;
  const cls = ["card"];
  if (st.done) cls.push("is-done");
  else if (isCurrent) cls.push("is-current");

  const tagHtml = st.done
    ? `<span class="tag done">concluída</span>`
    : (isCurrent ? `<span class="tag">${classify(w.iso)==="today" ? "hoje" : "próxima"}</span>` : "");

  return `
  <div class="${cls.join(' ')}" data-week="${w.n}">
    <button class="card-head" type="button" aria-expanded="false" data-toggle="${w.n}">
      <span class="num">${String(w.n).padStart(2,'0')}</span>
      <span class="head-text">
        <span class="date-row"><span class="date">${w.date}/2026</span>${tagHtml}</span>
        <span class="title">${escapeHtml(w.title)}</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="card-body">
      <div class="card-body-inner">
        <div class="content">

          <div class="block">
            <p class="label">Ideia central</p>
            <p class="idea">${escapeHtml(w.ideia)}</p>
          </div>

          <div class="block">
            <p class="label">Palavras-chave</p>
            <div class="keywords">${w.keywords.map(k=>`<span class="chip">${escapeHtml(k)}</span>`).join('')}</div>
          </div>

          <div class="block">
            <p class="label">Esboço</p>
            ${renderEsboco(w.esboco)}
          </div>

          ${w.bonus ? `<div class="block"><p class="label">Bônus</p><p class="bonus">${escapeHtml(w.bonus)}</p></div>` : ''}

          <div class="block">
            <p class="label">Pergunta</p>
            <div class="pergunta-box">
              <p class="pergunta-txt">"${escapeHtml(w.pergunta)}"</p>
              <p class="pergunta-note">(${escapeHtml(w.perguntaNote)})</p>
              ${renderBranches(w.branches)}
            </div>
          </div>

          <div class="block">
            <button class="verse-toggle" type="button" data-verse="${w.n}" aria-expanded="false">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
              Ver base bíblica
            </button>
            <div class="verse-panel" id="verse-${w.n}">
              <p class="verse-ref">${escapeHtml(w.base)}</p>
              <div class="verse-links">${(w.refs||[]).map(r=>`<a class="verse-link" href="${r.u}" target="_blank" rel="noopener">Abrir ${escapeHtml(r.l)} no Bíblia Online ↗</a>`).join('')}</div>
              <p class="verse-note">${escapeHtml(w.ideia)}</p>
              <p class="verse-disclaimer">Resumo da passagem, não o texto literal — direitos autorais variam por tradução.</p>
              <textarea class="registro verse-text" data-verse-text="${w.n}" placeholder="Cole aqui o texto do versículo, da tradução que preferir">${escapeHtml(st.versiculo || '')}</textarea>
            </div>
          </div>

          <div class="block registro-wrap">
            <p class="label">Registro</p>
            <textarea class="registro" data-registro="${w.n}" placeholder="Como foi a conversa? Surgiu algum pedido de oração ou comentário pra retomar depois?">${escapeHtml(st.registro)}</textarea>
            <div class="done-row">
              <label>
                <input type="checkbox" data-done="${w.n}" ${st.done ? 'checked' : ''}>
                Já apresentei essa semana
              </label>
              <span class="save-hint" data-hint="${w.n}">salvo</span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>`;
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    state = res && res.value ? JSON.parse(res.value) : {};
  } catch(e){
    state = {};
  }
  stateLoaded = true;
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  } catch(e){
    console.error('Erro ao salvar', e);
  }
}

function updateProgress(){
  const total = WEEKS.length;
  const done = WEEKS.filter(w => state[w.n] && state[w.n].done).length;
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
  document.getElementById('progressLabel').textContent = `${done}/${total}`;
}

function showHint(n){
  const el = document.querySelector(`[data-hint="${n}"]`);
  if (!el) return;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 1200);
}

function attachEvents(){
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.card');
      const isOpen = card.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  });

  document.querySelectorAll('[data-verse]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const n = btn.getAttribute('data-verse');
      const panel = document.getElementById('verse-' + n);
      const showing = panel.classList.toggle('show');
      btn.setAttribute('aria-expanded', showing ? 'true' : 'false');
      btn.lastChild.textContent = showing ? ' Ocultar base bíblica' : ' Ver base bíblica';
    });
  });

  document.querySelectorAll('[data-registro]').forEach(ta => {
    ta.addEventListener('click', e => e.stopPropagation());
    let timer;
    ta.addEventListener('input', () => {
      const n = ta.getAttribute('data-registro');
      if (!state[n]) state[n] = { done:false, registro:'' };
      state[n].registro = ta.value;
      clearTimeout(timer);
      timer = setTimeout(async () => {
        await saveState();
        showHint(n);
      }, 600);
    });
  });

  document.querySelectorAll('[data-verse-text]').forEach(ta => {
    ta.addEventListener('click', e => e.stopPropagation());
    let timer;
    ta.addEventListener('input', () => {
      const n = ta.getAttribute('data-verse-text');
      if (!state[n]) state[n] = { done:false, registro:'', versiculo:'' };
      state[n].versiculo = ta.value;
      clearTimeout(timer);
      timer = setTimeout(async () => {
        await saveState();
        showHint(n);
      }, 600);
    });
  });

  document.querySelectorAll('[data-done]').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', async () => {
      const n = cb.getAttribute('data-done');
      if (!state[n]) state[n] = { done:false, registro:'', versiculo:'' };
      state[n].done = cb.checked;
      const card = document.querySelector(`.card[data-week="${n}"]`);
      card.classList.toggle('is-done', cb.checked);
      const tagSlot = card.querySelector('.tag');
      await saveState();
      updateProgress();
      showHint(n);
    });
  });

  document.getElementById('expandAllBtn').addEventListener('click', () => {
    document.querySelectorAll('.card').forEach(c => {
      c.classList.add('open');
      c.querySelector('[data-toggle]').setAttribute('aria-expanded','true');
    });
  });
  document.getElementById('collapseAllBtn').addEventListener('click', () => {
    document.querySelectorAll('.card').forEach(c => {
      c.classList.remove('open');
      c.querySelector('[data-toggle]').setAttribute('aria-expanded','false');
    });
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    if (!confirm('Isso vai apagar todos os registros e marcações salvas. Confirmar?')) return;
    state = {};
    await saveState();
    render();
  });
}

function render(){
  const container = document.getElementById('weeksContainer');
  const currentN = findCurrentWeek();
  container.innerHTML = WEEKS.map(w => cardTemplate(w, currentN)).join('');
  attachEvents();
  updateProgress();

  // auto-open the current/next week
  const currentCard = document.querySelector(`.card[data-week="${currentN}"]`);
  if (currentCard){
    currentCard.classList.add('open');
    currentCard.querySelector('[data-toggle]').setAttribute('aria-expanded','true');
    setTimeout(() => currentCard.scrollIntoView({behavior:'smooth', block:'center'}), 300);
  }
}

(async function init(){
  await loadState();
  render();
})();
</script>
